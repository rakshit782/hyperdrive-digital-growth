<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | AMZ AD SCOUT</title>
    <meta
      name="description"
      content="The page you're looking for doesn't exist or has been moved to a different location."
    />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(to bottom right, #f8fafc, #ffffff, #eff6ff);
        color: #0f172a;
      }
      header {
        max-width: 72rem;
        margin: 0 auto;
        padding: 1.5rem 1.5rem 0;
      }
      header a {
        color: #0f172a;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-decoration: none;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 6rem 1.5rem 5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(5rem, 12vw, 8rem);
        line-height: 1;
        color: #e2e8f0;
      }
      h2 {
        margin: 0 0 1.5rem;
        font-size: clamp(1.875rem, 4vw, 2.25rem);
      }
      p {
        margin: 0 0 2rem;
        color: #475569;
        font-size: 1.25rem;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }
      a.button, button.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3.25rem;
        padding: 0.75rem 2rem;
        border-radius: 0.75rem;
        font: inherit;
        font-size: 1.125rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      a.primary {
        color: #fff;
        background: linear-gradient(to right, #2563eb, #9333ea);
        box-shadow: 0 10px 15px -3px rgb(15 23 42 / 0.15);
      }
      button.secondary {
        color: #1e293b;
        background: rgb(255 255 255 / 0.8);
        border: 2px solid #cbd5e1;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">AMZ AD SCOUT</a>
    </header>
    <main>
      <h1>404</h1>
      <h2>Oops! Page not found</h2>
      <p>The page you're looking for doesn't exist or has been moved to a different location.</p>
      <div class="actions">
        <a class="button primary" href="/">Return to Home</a>
        <button class="button secondary" type="button" onclick="history.back()">Go Back</button>
      </div>
    </main>
  </body>
</html>
